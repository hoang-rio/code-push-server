name: "Docker image build and deploy"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_build:
        description: "Build and push the Docker image even if api/ has not changed"
        type: boolean
        default: false
env:
  REGISTRY: ghcr.io
  SSH_KEY_FILE_DIR: .keys
  SSH_KEY_FILE_PATH: .keys/deploy_key.pem

concurrency:
  group: ${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_built: ${{ steps.check_api_changed.outputs.image_built }}
      compose_changed: ${{ steps.check_api_changed.outputs.compose_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the pre-push commit referenced by github.event.before
          # is always available for the change detection below.
          fetch-depth: 0
      - name: Check if API has changed
        id: check_api_changed
        run: |
          set -euo pipefail

          HEAD_SHA="${{ github.sha }}"
          BASE="${{ github.event.before }}"
          CHANGED=false
          COMPOSE_CHANGED=false

          # github.event.before is the previous head of the branch. Fall back to the
          # head's first parent when before is missing (first push / new branch) or
          # no longer exists (force push). This also covers merge commits, which
          # `git show` reports with no file list at all and therefore used to skip
          # the build.
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse --verify "${HEAD_SHA}^" 2>/dev/null || true)"
          fi

          if [ "${{ inputs.force_build }}" = "true" ]; then
            # Manual run with "force build" ticked: skip the change detection.
            echo "Force build requested via workflow_dispatch"
            CHANGED=true
          elif [ -z "$BASE" ]; then
            # Root commit: no base to compare against, so rebuild to stay safe.
            echo "No base commit found, assuming API has changed"
            CHANGED=true
          else
            # Written to a file first: piping into `grep -q` can make git exit with
            # SIGPIPE, which `pipefail` would turn into a false "no changes".
            CHANGED_FILES="$RUNNER_TEMP/changed-files.txt"
            git diff --name-only "$BASE" "$HEAD_SHA" > "$CHANGED_FILES"

            if grep -qE '^api/|^Dockerfile$' "$CHANGED_FILES"; then
              echo "API has changed"
              CHANGED=true
            else
              echo "API has not changed"
            fi

            # A compose-only change still needs the deploy job, but not a rebuild.
            if grep -qE '^docker-compose\.ya?ml$' "$CHANGED_FILES"; then
              echo "docker-compose.yml has changed"
              COMPOSE_CHANGED=true
            else
              echo "docker-compose.yml has not changed"
            fi
          fi

          echo "image_built=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "compose_changed=$COMPOSE_CHANGED" >> "$GITHUB_OUTPUT"
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        if: steps.check_api_changed.outputs.image_built == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push docker image
        if: steps.check_api_changed.outputs.image_built == 'true'
        run: |
          docker compose build --push
  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    # Nothing to deploy when no new image was pushed and docker-compose.yml is unchanged.
    if: needs.build.outputs.image_built == 'true' || needs.build.outputs.compose_changed == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create deploy key file
        run: |
          mkdir -p "${{ env.SSH_KEY_FILE_DIR }}"
          printf '%s\n' "${{ secrets.SSH_DEPLOY_KEY }}" > "${{ env.SSH_KEY_FILE_PATH }}"
          chmod 600 "${{ env.SSH_KEY_FILE_PATH }}"
      - name: Deploy with ssh
        env:
          IMAGE_BUILT: ${{ needs.build.outputs.image_built }}
        run: |
          rsync -avz -e "ssh -i ${{ env.SSH_KEY_FILE_PATH }} -o StrictHostKeyChecking=no" \
            docker-compose.yml \
            "${{ secrets.SSH_DEPLOY_USER }}@${{ secrets.SSH_DEPLOY_HOST }}:${{ secrets.SSH_DEPLOY_PATH }}/"

          REMOTE_CMD="cd ${{ secrets.SSH_DEPLOY_PATH }}/"
          if [ "$IMAGE_BUILT" = "true" ]; then
            REMOTE_CMD="$REMOTE_CMD && docker compose pull"
          fi
          REMOTE_CMD="$REMOTE_CMD && docker compose up -d"

          # Only reclaim space when a new image was actually pushed; a config-only
          # deploy creates nothing to prune.
          if [ "$IMAGE_BUILT" = "true" ]; then
            REMOTE_CMD="$REMOTE_CMD && docker image prune -af"
          fi

          ssh -i "${{ env.SSH_KEY_FILE_PATH }}" -o StrictHostKeyChecking=no \
            "${{ secrets.SSH_DEPLOY_USER }}@${{ secrets.SSH_DEPLOY_HOST }}" "$REMOTE_CMD"
